name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Validate Bicep
        run: |
          az bicep install --version v0.46.1
          az bicep lint --file infra/key-vault/main.bicep
          az bicep lint --file infra/key-vault/key.bicep
          az bicep build --file infra/key-vault/main.bicep --stdout > /dev/null
          az bicep build --file infra/key-vault/key.bicep --stdout > /dev/null
      - name: Restore
        run: dotnet restore EMF.sln -p:AuditPipeline=true
      - name: Build
        run: dotnet build EMF.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/EMF.Tests/EMF.Tests.csproj --configuration Release --no-build --no-restore
      - name: Audit dependencies
        run: dotnet package list --project EMF.sln --vulnerable --include-transitive
